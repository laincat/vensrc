name: Vensrc 巡检与订阅

on:
  schedule:
    # 每小时第 7 分钟运行（GitHub cron 按 UTC 解释，整点后 7 分）。
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patrol.yml"
      - "scripts/**"
      - "monitor/**"
      - "sources/**"

permissions:
  contents: read

# 巡检与反爬诊断都会把生成文件写回 main，共用同一个并发组，避免同时推送。
concurrency:
  group: vensrc-main
  cancel-in-progress: false

jobs:
  # 审阅清单只在这里由自动化写入：有写权限，但不加载、不执行任何源码。
  # 清单必须在巡检之前改好，因为本轮全部证据都绑定巡检时的清单哈希；
  # 放到发布阶段末尾再改，会让 main 上的清单与刚发布的证据对不上。
  promote:
    name: 复核上一轮候选证据并写入审阅清单（不执行源码）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.write.outputs.sha }}
    steps:
      - name: 读取受信任的脚本和上一轮发布阶段排好的队列
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main 上的运行取最新提交，才能读到上一轮刚排好的队列；其他分支只演练、不写入。
          ref: ${{ github.ref == 'refs/heads/main' && 'refs/heads/main' || github.sha }}
          persist-credentials: false
      - name: 校验审阅清单和索引标准
        run: |
          python3 scripts/cloud_audit.py self-test
          python3 -m unittest discover -s scripts -p '*_test.py'
      - name: 重新核对固定提交地址、SHA-256、收录条件和两端记录后写入清单
        run: python3 scripts/cloud_audit.py promote
      - name: 提交清单改动
        id: write
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          git add -- monitor/catalog.json
          # 第一次上线时还没有队列文件。
          if test -f data/auto-inclusion.json; then git add -- data/auto-inclusion.json; fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] || git diff --cached --quiet; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "自动收录：写入复核通过的同 key 新版本并整理已稳定的旧构建"
          # 不强推、不变基：main 在复核期间变了就放弃本轮写入，队列留到下一轮。
          if git -c credential.helper='!gh auth git-credential' push origin HEAD:main; then
            sha="$(git rev-parse HEAD)"
          else
            echo "::warning::main 在复核期间有更新，本轮不写入清单；队列保留到下一轮。"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  patrol:
    name: 获取最新工具、巡检固定样本并生成中文报告
    needs: promote
    # 自动收录出问题不能拦住已审阅构建的巡检。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 读取订阅仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.sha || github.sha }}
          persist-credentials: false
      - name: 校验审阅清单和索引标准
        run: |
          python3 scripts/cloud_audit.py self-test
          python3 -m unittest discover -s scripts -p '*_test.py'
      - name: 每次巡检前获取最新 venera-patrol-cli 并安装锁定依赖
        run: python3 scripts/cloud_audit.py setup-cli --work "$RUNNER_TEMP/venera"
      - name: 检查上游及三个自用仓库的变动（不执行新代码）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_audit.py discover --work "$RUNNER_TEMP/venera"
      - name: 在无 GitHub 凭据的容器中巡检已审阅源码，并试跑本轮候选
        env:
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/cloud_audit.py patrol --work "$RUNNER_TEMP/venera"
      - name: 展示中文巡检摘要
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/venera/artifact/preview/reports/RESULTS.md"; then
            cat "$RUNNER_TEMP/venera/artifact/preview/reports/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次巡检未完整完成，不更新订阅。请查看失败步骤；不会使用缓存旧版 CLI 冒充最新。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 保存结构化证据和中文预览
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venera-patrol-results
          path: ${{ runner.temp }}/venera/artifact/
          if-no-files-found: warn
          retention-days: 30

  account_patrol:
    name: 按站点隔离账号并对照两个客户端
    needs: promote
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 读取已审阅账号白名单
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.sha || github.sha }}
          persist-credentials: false
      - name: 独立获取最新 CLI、校验客户端并安装依赖
        run: python3 scripts/cloud_audit.py setup-cli --work "$RUNNER_TEMP/venera-accounts"
      - name: 每个容器只接收本站 Secret，禁用写操作
        env:
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PATROL_AUTH_MANHUAGUI: ${{ secrets.PATROL_AUTH_MANHUAGUI }}
          PATROL_AUTH_JM: ${{ secrets.PATROL_AUTH_JM }}
          PATROL_AUTH_BAOZI: ${{ secrets.PATROL_AUTH_BAOZI }}
          PATROL_AUTH_PICACG: ${{ secrets.PATROL_AUTH_PICACG }}
          PATROL_AUTH_COPY_MANGA: ${{ secrets.PATROL_AUTH_COPY_MANGA }}
          PATROL_AUTH_HOT_MANGA: ${{ secrets.PATROL_AUTH_HOT_MANGA }}
        run: python3 scripts/account_patrol.py patrol --work "$RUNNER_TEMP/venera-accounts"
      - name: 保存脱敏账号结果
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venera-account-results
          path: ${{ runner.temp }}/venera-accounts/account-artifact/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 复核证据后发布主／扩展订阅
    needs: [promote, patrol, account_patrol]
    if: ${{ !cancelled() && needs.patrol.result == 'success' && needs.account_patrol.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 读取受信任的生成脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.sha || github.sha }}
          persist-credentials: false
      - name: 下载本次巡检证据
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: venera-patrol-results
          path: .audit-results
      - name: 核对清单哈希、固定样本和收录标准，复核候选试跑结果
        env:
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/cloud_audit.py publish --input .audit-results/patrol.json
      - name: 下载脱敏账号结果
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: venera-account-results
          path: .account-results
      - name: 复核账号白名单并生成中文报告
        run: python3 scripts/account_patrol.py publish --input .account-results/data/account-results.json
      - name: 单列七个社区替代构建与三个自用仓库的双客户端和登录结果
        run: python3 scripts/focus_report.py
      - name: 提交中文报告与订阅
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- subscriptions/ data/ reports/
          git -c credential.helper='!gh auth git-credential' fetch origin main
          # 本轮之后受信任的清单或脚本被改过时，不能用旧证据发布。
          if ! git diff --quiet HEAD origin/main -- monitor/ scripts/ sources/ .github/workflows/patrol.yml .github/scripts/; then
            echo "main 上的受信任清单或脚本在本轮巡检之后有更新，放弃本次发布；重跑巡检即可。" >&2
            exit 1
          fi
          bash .github/scripts/push_generated.sh "定时巡检：更新主／扩展订阅及中文报告"
