name: Vensrc 巡检与订阅

on:
  schedule:
    # 每小时第 7 分钟运行（GitHub cron 按 UTC 解释，整点后 7 分）。
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patrol.yml"
      - "scripts/**"
      - "monitor/**"
      - "sources/**"

permissions:
  contents: read

# 巡检与反爬诊断都会把生成文件写回 main，共用同一个并发组，避免同时推送。
concurrency:
  group: vensrc-main
  cancel-in-progress: false

jobs:
  patrol:
    name: 获取最新工具、巡检固定样本并生成中文报告
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 读取订阅仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 校验审阅清单和索引标准
        run: |
          python3 scripts/cloud_audit.py self-test
          python3 -m unittest discover -s scripts -p '*_test.py'
      - name: 每次巡检前获取最新 venera-patrol-cli 并安装锁定依赖
        run: python3 scripts/cloud_audit.py setup-cli --work "$RUNNER_TEMP/venera"
      - name: 检查上游及三个自用仓库的变动（不执行新代码）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_audit.py discover --work "$RUNNER_TEMP/venera"
      - name: 在无 GitHub 凭据的容器中巡检已审阅源码
        env:
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/cloud_audit.py patrol --work "$RUNNER_TEMP/venera"
      - name: 展示中文巡检摘要
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/venera/artifact/preview/reports/RESULTS.md"; then
            cat "$RUNNER_TEMP/venera/artifact/preview/reports/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次巡检未完整完成，不更新订阅。请查看失败步骤；不会使用缓存旧版 CLI 冒充最新。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 保存结构化证据和中文预览
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venera-patrol-results
          path: ${{ runner.temp }}/venera/artifact/
          if-no-files-found: warn
          retention-days: 30

  account_patrol:
    name: 按站点隔离账号并对照两个客户端
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 读取已审阅账号白名单
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 独立获取最新 CLI、校验客户端并安装依赖
        run: python3 scripts/cloud_audit.py setup-cli --work "$RUNNER_TEMP/venera-accounts"
      - name: 每个容器只接收本站 Secret，禁用写操作
        env:
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PATROL_AUTH_MANHUAGUI: ${{ secrets.PATROL_AUTH_MANHUAGUI }}
          PATROL_AUTH_JM: ${{ secrets.PATROL_AUTH_JM }}
          PATROL_AUTH_BAOZI: ${{ secrets.PATROL_AUTH_BAOZI }}
          PATROL_AUTH_PICACG: ${{ secrets.PATROL_AUTH_PICACG }}
          PATROL_AUTH_COPY_MANGA: ${{ secrets.PATROL_AUTH_COPY_MANGA }}
          PATROL_AUTH_HOT_MANGA: ${{ secrets.PATROL_AUTH_HOT_MANGA }}
        run: python3 scripts/account_patrol.py patrol --work "$RUNNER_TEMP/venera-accounts"
      - name: 保存脱敏账号结果
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venera-account-results
          path: ${{ runner.temp }}/venera-accounts/account-artifact/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 复核证据后发布主／扩展订阅
    needs: [patrol, account_patrol]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 读取受信任的生成脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 下载本次巡检证据
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: venera-patrol-results
          path: .audit-results
      - name: 核对清单哈希、固定样本和收录标准
        env:
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/cloud_audit.py publish --input .audit-results/patrol.json
      - name: 下载脱敏账号结果
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: venera-account-results
          path: .account-results
      - name: 复核账号白名单并生成中文报告
        run: python3 scripts/account_patrol.py publish --input .account-results/data/account-results.json
      - name: 单列七个社区替代构建与三个自用仓库的双客户端和登录结果
        run: python3 scripts/focus_report.py
      - name: 提交中文报告与订阅
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- subscriptions/ data/ reports/
          git -c credential.helper='!gh auth git-credential' fetch origin main
          # 本轮之后受信任的清单或脚本被改过时，不能用旧证据发布。
          if ! git diff --quiet HEAD origin/main -- monitor/ scripts/ sources/ .github/workflows/patrol.yml .github/scripts/; then
            echo "main 上的受信任清单或脚本在本轮巡检之后有更新，放弃本次发布；重跑巡检即可。" >&2
            exit 1
          fi
          bash .github/scripts/push_generated.sh "定时巡检：更新主／扩展订阅及中文报告"
